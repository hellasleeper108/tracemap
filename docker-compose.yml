version: "3.9"

services:
  hub:
    build: .
    ports:
      - "9999:9999"
    command: ["python3", "tracemap.py", "--hub", "/config/agents.json"]
    volumes:
      - ./config:/config
    restart: unless-stopped

  agent1:
    build: .
    ports:
      - "10001:9999"
    command: ["python3", "tracemap.py", "--agent"]
    restart: unless-stopped

  agent2:
    build: .
    ports:
      - "10002:9999"
    command: ["python3", "tracemap.py", "--agent"]
    restart: unless-stopped
